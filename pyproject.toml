[project]
name = "detect-me"
version = "0.1.0"
description = "TRACER - production-grade fraud detection: FastAPI scoring, GBDT detector, graph AML, red-team hardening"
authors = [
    {name = "Whitejack"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch (>=2.13.0,<3.0.0)",
    "xgboost (<4)",
    "pandas (<3)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "catboost (>=1.2.10,<2.0.0)",
    "polars (>=1.43.2,<2.0.0)",
    "mlflow (>=3.15.1,<4.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "uvicorn (>=0.52.3,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "tracer", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
